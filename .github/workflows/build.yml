name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Buildozer dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade buildozer cython

    - name: Build APK with Buildozer
      run: |
        buildozer init
        sed -i 's/title = My Application/title = Jarvis/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = jarvis/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,google-generativeai/' buildozer.spec
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Jarvis-APK
        path: bin/*.apk
        
